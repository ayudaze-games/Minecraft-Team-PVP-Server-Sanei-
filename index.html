<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サネイチーム マイクラサーバー公式</title>
</head>
<body style="font-family: sans-serif; background-color: #f0f2f5; margin: 20px;">

    <h1>サネイチームのマイクラサーバーへようこそ！</h1>
    <p>このサイトは公式ホームページです。</p>

    <!-- ⚡ 自動切り替え対応ステータスパーツ -->
    <div style="background: #2c2c2c; color: #fff; padding: 20px; border-radius: 10px; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        
        <!-- ここが自動で 🟢か🔴 に変わります -->
        <h3 id="server-status-title" style="margin-top: 0; color: #aaa;">🔍 状況を確認中...</h3>
        
        <img src="https://mcsrvstat.us" alt="サーバーアイコン" style="width: 64px; height: 64px; margin-bottom: 10px; border-radius: 5px;">
        <p><strong>アドレス：</strong><br><span style="color: #55ff55; font-family: monospace;">sanei-teamvpserver.duckdns.org</span></p>
        
        <!-- 詳細情報が出るエリア -->
        <div id="server-info" style="font-size: 14px; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;">
            読み込み中...
        </div>
    </div>

    <!-- 🧠 裏でサーバーの状態をチェックするプログラム -->
    <script>
        async function checkServer() {
            const titleEl = document.getElementById('server-status-title');
            const infoEl = document.getElementById('server-info');
            
            try {
                // マイクラサーバーの状況をAPIで取得
                const response = await fetch('https://mcsrvstat.us');
                const data = await response.json();
                
                if (data.online === true) {
                    // オンラインのときの表示
                    titleEl.innerHTML = '🟢 ONLINE';
                    titleEl.style.color = '#55ff55';
                    infoEl.innerHTML = `
                        <p style="margin: 5px 0;"><strong>人数：</strong> ${data.players.online} / ${data.players.max} 人</p>
                        <p style="margin: 5px 0; color: #888; font-size: 12px;">バージョン: ${data.version}</p>
                    `;
                } else {
                    // オフラインのときの表示
                    titleEl.innerHTML = '🔴 OFFLINE';
                    titleEl.style.color = '#ff5555';
                    infoEl.innerHTML = '<p style="color: #ff5555; margin: 5px 0;">サーバーは現在停止しています。</p>';
                }
            } catch (error) {
                titleEl.innerHTML = '⚠️ エラー';
                titleEl.style.color = '#ffaa00';
                infoEl.innerHTML = 'ステータスの取得に失敗しました。';
            }
        }

        // ページが開かれたときにチェックを実行する
        checkServer();
    </script>

</body>
</html>
